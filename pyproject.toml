[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "lord-of-avondale"
version = "0.1.0"
description = "A modular, text-based multiplayer RPG inspired by classic MUDs."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
